# XcodeGen 工程定义
# Windows 上写不了 .xcodeproj（那是二进制/巨型文本），改成 YAML
# 云端 CI 跑一句 xcodegen generate 就把工程生成出来

name: AnRanIME

options:
  bundleIdPrefix: com.anran
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.9.50"
    CURRENT_PROJECT_VERSION: "85"
    SWIFT_VERSION: "5.0"
    SWIFT_COMPILATION_MODE: wholemodule
    # 出的是未签名包 签名交给用户手机那头的 Sideloadly
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_BITCODE: "NO"
    ALWAYS_SEARCH_USER_PATHS: "NO"
    # 防逆向：Release 包内符号全剥 二进制里不留函数名与调试信息
    DEPLOYMENT_POSTPROCESSING: "YES"
    STRIP_INSTALLED_PRODUCT: "YES"
    STRIP_STYLE: "all"
    COPY_PHASE_STRIP: "YES"
    GCC_SYMBOLS_PRIVATE_EXTERN: "YES"

targets:
  # ---------------- 主 app：设置 / 思想库 / 剪贴板 / 短语 ----------------
  AnRanIME:
    type: application
    platform: iOS
    sources:
      - path: Sources/HostApp
      - path: Sources/Shared
      - path: Support/server.crt
        buildPhase: resources
      - path: Support/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anran.ime
        INFOPLIST_FILE: Support/HostApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/HostApp/HostApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "NO"
    dependencies:
      - target: AnRanKeyboard
        embed: true

  # ---------------- 键盘扩展：输入法本体 ----------------
  AnRanKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Keyboard
      - path: Sources/Shared
      - path: Support/server.crt
        buildPhase: resources
      # 自研词库（librime 起不来时的兜底引擎用）
      - path: Support/dict/pinyin.bin.enc
        buildPhase: resources
      - path: Support/dict/assoc.bin.enc
        buildPhase: resources
      # 词级 n-gram 语言模型（ANWG v2，自研兜底引擎的上下文项升级）
      - path: Support/dict/assoc_w.bin.enc
        buildPhase: resources
      # 三元语言模型（ANWT v1）默认不打进包：实测句级首位 0 提升、P95 8.3→18.7ms。
      # 原因是语料（rime 短语 / jieba 词表 / 百度 seed 词条）全是「词组集合」，
      # 不含「一下再」「别着急」这类虚词序列，三元表恰好缺的正是要判的那一类。
      # 代码路径保留（PinyinEngine.loadTrigram），拿到真实句子语料后加回这两行即可启用。
      # - path: Support/dict/assoc_t.bin.enc
      #   buildPhase: resources
      # 百度内置词条 cell（口语片段/成语/软件名，10,736 条，解析自百度 APK 的 .bcd）
      - path: Support/dict/seed.bin.enc
        buildPhase: resources
      # Rime 中州韵方案数据（CI 拉鼠须管 SharedSupport 填进来；folder 引用保留目录结构）
      - path: Support/rime
        type: folder
        buildPhase: resources
      - path: Support/Keyboard/click.wav
        buildPhase: resources
      - path: Support/Keyboard/ime_logo.png
        buildPhase: resources
    # Rime 中州韵方案数据：键盘扩展内存只有 30~60MB，现场编译词库必被
    # jetsam 杀掉，所以必须在出包时就把 .bin 编好、随包带走（prebuilt）。
    # 关键：用「跟 App 里静态链接的同一份 librime」来编 bin（tools/rime_deploy.cc），
    # 产物格式与运行时严格一致；鼠须管自带的 rime_deployer 只当兜底。
    # 整段编不出来也不挡出包 —— 键盘会自动退回自研引擎。
    preBuildScripts:
      - name: 编译 Rime 预编译词库（prebuilt bin）
        basedOnDependencyAnalysis: false
        script: |
          set +e
          SHARED="$SRCROOT/Support/rime"
          mkdir -p "$SHARED"

          # 带重试的下载：CI 网络偶发超时会让 curl 静默失败，不重试就会退化成
          # 「只有 luna_pinyin 的残包」（用户实测就是栽在这个坑里）。
          fetch() {  # $1=url $2=dest
            n=1
            while [ $n -le 4 ]; do
              curl -fsSL --connect-timeout 20 --retry 2 --retry-delay 2 -o "$2" "$1"
              if [ -s "$2" ]; then return 0; fi
              echo "下载失败(第 $n 次): $1"; n=$((n+1)); sleep 4
            done
            return 1
          }

          # ---- 0. opencc 底座（离线优先）----
          # 雾凇拼音的 simplifier（emoji / 简繁）要 Rime 自带的 opencc 数据，
          # 光有 rime-ice 会缺 opencc 报错。仓库自带 rime-opencc.tgz（从已验证的
          # 出包里抽出），离线铺上；没有才联网去鼠须管拿。这一步不再依赖网络。
          if [ ! -d "$SHARED/opencc" ] && [ -f "$SRCROOT/Support/rime-opencc.tgz" ]; then
            echo "== 解仓库自带的 opencc 底座 =="
            tar -xzf "$SRCROOT/Support/rime-opencc.tgz" -C "$SHARED" 2>/dev/null
          fi

          # ---- 1. 鼠须管 SharedSupport 当底座：完整 opencc 数据 + prelude + luna_pinyin ----
          # 离线包没拿到时的联网兜底：先铺底座，再把雾凇覆盖上去。
          if [ ! -d "$SHARED/opencc" ]; then
            echo "== 拉鼠须管 SharedSupport（底座：opencc / prelude）=="
            rm -rf /tmp/sq.pkg /tmp/sq
            if fetch "https://github.com/rime/squirrel/releases/download/1.1.2/Squirrel-1.1.2.pkg" /tmp/sq.pkg; then
              pkgutil --expand-full /tmp/sq.pkg /tmp/sq 2>/dev/null
              SS=$(find /tmp/sq -type d -name SharedSupport 2>/dev/null | head -1)
              if [ -n "$SS" ]; then cp -R "$SS"/. "$SHARED"/ 2>/dev/null; fi
            fi
          fi

          # ---- 2. 雾凇拼音 rime-ice（社区里最接近百度的免费方案）----
          # 仓库自带 Support/rime-ice.tgz：离线、可复现，彻底避开 CI 网络抖动
          # 导致的「静默退化成只有 luna_pinyin 的残包」（用户实测就是栽在这）。
          ICE=""
          if [ -f "$SRCROOT/Support/rime-ice.tgz" ]; then
            echo "== 解仓库自带的 rime-ice.tgz =="
            rm -rf /tmp/ice; mkdir -p /tmp/ice
            tar -xzf "$SRCROOT/Support/rime-ice.tgz" -C /tmp/ice --strip-components=1 2>/dev/null
            [ -f /tmp/ice/rime_ice.schema.yaml ] && ICE=/tmp/ice
          fi
          if [ -z "$ICE" ]; then
            echo "== 仓库没带 rime-ice.tgz，联网拉 =="
            rm -rf /tmp/ice /tmp/ice.tgz; mkdir -p /tmp/ice
            if fetch "https://codeload.github.com/iDvel/rime-ice/tar.gz/refs/heads/main" /tmp/ice.tgz; then
              tar -xzf /tmp/ice.tgz -C /tmp/ice --strip-components=1 2>/dev/null
              [ -f /tmp/ice/rime_ice.schema.yaml ] && ICE=/tmp/ice
            fi
          fi

          if [ -n "$ICE" ]; then
            echo "== 铺雾凇拼音（整棵树：方案 + cn_dicts/en_dicts + lua + opencc + others）=="
            cp -R "$ICE"/. "$SHARED"/ 2>/dev/null
            rm -rf "$SHARED/.github" "$SHARED/AGENTS.md" "$SHARED/README.md" \
                   "$SHARED/recipe.yaml" "$SHARED/.gitignore" 2>/dev/null
          fi

          # 两个都没拿到，最后退回 rime 官方仓库直抓（质量一般但能出字）
          if [ ! -f "$SHARED/rime_ice.schema.yaml" ] && [ ! -f "$SHARED/luna_pinyin.dict.yaml" ]; then
            echo "== 再退回 rime-prelude + rime-luna-pinyin =="
            rm -rf /tmp/rp /tmp/rl; mkdir -p /tmp/rp /tmp/rl
            fetch "https://codeload.github.com/rime/rime-prelude/tar.gz/refs/heads/master" /tmp/rp.tgz
            fetch "https://codeload.github.com/rime/rime-luna-pinyin/tar.gz/refs/heads/master" /tmp/rl.tgz
            tar -xzf /tmp/rp.tgz -C /tmp/rp --strip-components=1 2>/dev/null
            tar -xzf /tmp/rl.tgz -C /tmp/rl --strip-components=1 2>/dev/null
            cp -R /tmp/rp/. "$SHARED"/ 2>/dev/null
            cp -R /tmp/rl/. "$SHARED"/ 2>/dev/null
          fi

          echo "== 方案就位情况 =="
          ls -l "$SHARED/rime_ice.schema.yaml" 2>/dev/null || echo "（没拿到 rime-ice）"
          ls -l "$SHARED/luna_pinyin.dict.yaml" 2>/dev/null || true
          ls -d "$SHARED/opencc" 2>/dev/null || echo "（没 opencc 数据）"
          ls -d "$SHARED/lua" 2>/dev/null || echo "（没 lua 脚本）"
          ls -d "$SHARED/cn_dicts" 2>/dev/null || echo "（没 cn_dicts 词库）"

          # ---- 3. 砍掉用不上的方案压包体（opencc / lua 留着，雾凇要用）----
          cd "$SHARED"
          rm -rf cangjie5* bopomofo* terra_pinyin* luna_quanpin* \
            luna_pinyin_tw* luna_pinyin_fluency* double_pinyin* \
            wubi* quick5* t9.schema.yaml squirrel.yaml weasel.yaml 2>/dev/null
          # page_size 是「一次能拿到多少条候选」的硬闸门：rime-ice 的 default.yaml
          # 写死 5，键盘就只拿得到 5 条，看着就比百度/搜狗少一大截。
          # 放到 30 —— 词库一点没变，只是把现成的候选多吐出来，这才叫用上商业级词库。
          if [ -f "$SHARED/rime_ice.schema.yaml" ]; then
            printf 'patch:\n  menu/page_size: 30\n  schema_list:\n    - schema: rime_ice\n    - schema: melt_eng\n' \
              > "$SHARED/default.custom.yaml"
          else
            printf 'patch:\n  menu/page_size: 30\n  schema_list:\n    - schema: luna_pinyin_simp\n    - schema: luna_pinyin\n' \
              > "$SHARED/default.custom.yaml"
          fi

          # ---- 3.5 八股文语言模型（octagram LM）----
          # librime 静态库已编入 octagram 插件，只差模型文件与配置。
          # 有了 LM 整句候选按上下文搭配打分，这是跟商业输入法（百度级）
          # 掰手腕的核心件。gram 走 mmap，体积在 MB 级，内存安全。
          # 优先 CI 在线拉最新版（质量更好），失败退回仓库内置版。
          GRAM="$SHARED/zh-hans-t-essay-bgc.gram"
          if fetch "https://raw.githubusercontent.com/lotem/rime-octagram-data/hans/zh-hans-t-essay-bgc.gram" "$GRAM.tmp"; then
            mv "$GRAM.tmp" "$GRAM"
            echo "== 在线拉到最新八股文模型 =="
          elif [ -f "$SRCROOT/Support/zh-hans-t-essay-bgc.gram" ]; then
            cp "$SRCROOT/Support/zh-hans-t-essay-bgc.gram" "$GRAM" 2>/dev/null
            echo "== 在线拉取失败，用仓库内置八股文模型兜底 =="
          fi
          if [ -s "$GRAM" ]; then
            echo "== 八股文语言模型就位：$(ls -l "$GRAM") =="
            cat > "$SHARED/rime_ice.custom.yaml" <<'YAML'
          patch:
            menu/page_size: 30
            grammar:
              language: zh-hans-t-essay-bgc
              collocation_max_length: 5
              collocation_min_length: 2
            translator/contextual_suggestions: true
            translator/initial_quality: 1.2
            # 模糊音（对标百度默认档）：雾凇默认整段注释，这里补回来，
            # 让 librime 主力引擎也吃容错，而不是只有自研兜底层吃。
            # 取舍：只留百度默认档的规则（平翘舌、n/l、前后鼻音），
            # 删掉 f/h、l/r 双向全开——过于激进，打 "fa" 会混入 "ha"
            # 系候选、打 "li" 混入 "ri" 系，叠加超级简拼和 page_size
            # 30 会把正确候选冲下去，单行候选栏变成一锅粥。
            speller/algebra/+:
              # 声母
              - derive/^([zcs])h/$1/
              - derive/^([zcs])([^h])/$1h$2/
              - derive/^l/n/
              - derive/^n/l/
              # 韵母
              - derive/ang$/an/
              - derive/an$/ang/
              - derive/eng$/en/
              - derive/en$/eng/
              - derive/in$/ing/
              - derive/ing$/in/
              - derive/ian$/iang/
              - derive/iang$/ian/
              - derive/uan$/uang/
              - derive/uang$/uan/
          YAML
            echo "== rime_ice.custom.yaml（grammar + 模糊音）已写入 =="
          else
            echo "（没拿到 gram 模型，跳过 LM 配置）"
          fi

          # ---- 4. 编 bin：优先用自带 deployer（与运行时同版本 librime）----
          REPORT="$SHARED/_report.txt"
          : > "$REPORT"
          MAC_LIB="$SRCROOT/ThirdParty/librime/librime-static.xcframework/macos-arm64_x86_64/librime.a"
          MAC_HDR="$SRCROOT/ThirdParty/librime/librime-static.xcframework/macos-arm64_x86_64/Headers"
          # 这段脚本跑在 Xcode 构建环境里，SDKROOT 被设成 iphoneos。直接调 clang++
          # 会按 iOS 目标链接，撞上 macOS 切片的 librime 目标文件：
          #   ld: building for 'iOS', but linking in object file ... built for 'macOS'
          # 必须显式把 SDKROOT / -isysroot 指到 macOS SDK，deployer 才编得出来。
          MACOS_SDK=$(xcrun --sdk macosx --show-sdk-path 2>/dev/null)
          echo "== macOS SDK: $MACOS_SDK ==" | tee -a "$REPORT"
          DEPLOYER=""
          if [ -f "$MAC_LIB" ] && [ -n "$MACOS_SDK" ]; then
            echo "== 编译自带 deployer（与运行时同版本 librime）==" | tee -a "$REPORT"
            SDKROOT="$MACOS_SDK" clang++ -std=c++17 -O1 -I "$MAC_HDR" \
              -isysroot "$MACOS_SDK" -target arm64-apple-macos11.0 \
              "$SRCROOT/tools/rime_deploy.cc" \
              -Wl,-force_load,"$MAC_LIB" -o /tmp/anran_rime_deploy \
              -lc++ -lz -liconv -framework Foundation >> "$REPORT" 2>&1
            if [ ! -x /tmp/anran_rime_deploy ]; then
              echo "（带 -liconv 链接失败，去掉 -liconv 重试）" | tee -a "$REPORT"
              SDKROOT="$MACOS_SDK" clang++ -std=c++17 -O1 -I "$MAC_HDR" \
                -isysroot "$MACOS_SDK" -target arm64-apple-macos11.0 \
                "$SRCROOT/tools/rime_deploy.cc" \
                -Wl,-force_load,"$MAC_LIB" -o /tmp/anran_rime_deploy \
                -lc++ -lz -framework Foundation >> "$REPORT" 2>&1
            fi
            [ -x /tmp/anran_rime_deploy ] && DEPLOYER=/tmp/anran_rime_deploy
          else
            echo "（缺 macOS 切片 librime.a 或 macOS SDK：$MAC_LIB）" | tee -a "$REPORT"
          fi

          run_deployer() {   # $1=deployer 可执行文件
            rm -rf "$SHARED/_u" && mkdir -p "$SHARED/_u"
            if [ "$1" = "/tmp/anran_rime_deploy" ]; then
              "$1" "$SHARED" "$SHARED/_u" >> "$REPORT" 2>&1
            else
              "$1" --build "$SHARED" "$SHARED/_u" >> "$REPORT" 2>&1
            fi
            echo "deployer exit=$?" | tee -a "$REPORT"
            mkdir -p "$SHARED/build"
            if ls "$SHARED/_u/build/"*.bin >/dev/null 2>&1; then
              cp "$SHARED/_u/build/"*.bin "$SHARED/build/" 2>/dev/null
            fi
            rm -rf "$SHARED/_u"
          }

          if [ -n "$DEPLOYER" ]; then
            echo "== 编预编译 bin：$DEPLOYER ==" | tee -a "$REPORT"
            run_deployer "$DEPLOYER"
          fi

          # 自带 deployer 没出 bin：退回鼠须管 rime_deployer 再试一次
          if ! ls "$SHARED/build/"*.bin >/dev/null 2>&1; then
            if [ -z "$(find /tmp/sq -name rime_deployer 2>/dev/null | head -1)" ]; then
              echo "== 没现成鼠须管，先下载当兜底 ==" | tee -a "$REPORT"
              rm -rf /tmp/sq.pkg /tmp/sq
              if fetch "https://github.com/rime/squirrel/releases/download/1.1.2/Squirrel-1.1.2.pkg" /tmp/sq.pkg; then
                pkgutil --expand-full /tmp/sq.pkg /tmp/sq 2>/dev/null
              fi
            fi
            SQ=$(find /tmp/sq -name rime_deployer 2>/dev/null | head -1)
            if [ -n "$SQ" ]; then
              echo "== 自带 deployer 没出 bin，改试鼠须管 rime_deployer：$SQ ==" | tee -a "$REPORT"
              run_deployer "$SQ"
            fi
          fi

          # 再不行：把鼠须管 SharedSupport 里自带的预编译 bin 直接搬来兜底
          if ! ls "$SHARED/build/"*.bin >/dev/null 2>&1; then
            SQBUILD=$(find /tmp/sq -type d -name build 2>/dev/null | head -1)
            if [ -n "$SQBUILD" ] && ls "$SQBUILD"/*.bin >/dev/null 2>&1; then
              echo "== 搬鼠须管自带预编译 bin 兜底：$SQBUILD ==" | tee -a "$REPORT"
              mkdir -p "$SHARED/build"
              cp "$SQBUILD"/*.bin "$SHARED/build/" 2>/dev/null
            fi
          fi

          # ---- 5. yaml 时间戳改旧，让 librime 认定 bin 是最新的，直接复用不重编 ----
          find "$SHARED" -name '*.yaml' -exec touch -t 202001010000 {} + 2>/dev/null

          echo "== rime 数据 =="; ls -lh "$SHARED" | head -40
          echo "== prebuilt bin =="; ls -lh "$SHARED/build" 2>/dev/null || echo "（无预编译 bin，运行时会退回自研引擎）"
          {
            echo "---- 预编译 bin 清单 ----"
            ls -l "$SHARED/build" 2>/dev/null || echo "（无 build 目录）"
          } >> "$REPORT"
          exit 0
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anran.ime.keyboard
        INFOPLIST_FILE: Support/Keyboard/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        # 脚本阶段要联网拉词库、跑 deployer，关掉脚本沙箱
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        # Swift 调 librime 的 ObjC++ 桥（RimeBridge）
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Keyboard/AnRanKeyboard-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        CLANG_CXX_LIBRARY: libc++
        # librime 静态库头文件（xcframework 的 device 切片）
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/ThirdParty/librime/librime-static.xcframework/ios-arm64/Headers
          - $(SRCROOT)/ThirdParty/librime/librime-static.xcframework/ios-arm64_x86_64-simulator/Headers
        # 关键：librime 的各个 module 靠静态构造函数自注册，纯静态链接会被
        # 链接器当「没人引用的对象」丢掉，结果 initialize 找不到任何 translator。
        # 用 -force_load 把整份 librime.a 全部拉进来，构造函数才会跑。
        OTHER_LDFLAGS:
          - -Wl,-force_load,$(SRCROOT)/ThirdParty/librime/librime-static.xcframework/ios-arm64/librime.a
          - -lc++
          - -lz
          - -liconv

schemes:
  AnRanIME:
    build:
      targets:
        AnRanIME: all
    run:
      config: Debug
    archive:
      config: Release
