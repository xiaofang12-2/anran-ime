name: build-ipa

# 本地是 Windows 编不了 iOS，靠云 Mac 出包。
# 触发：手动点，或推 main 分支。
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # 不用 macos-latest（=macos-26 新镜像，灰度期机器池抽风：15分钟零步骤被取消）
    # 固定到上一代稳定的 macOS 15 arm64，工具链与出包结果一致
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: 装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 显示可用 SDK
        run: xcodebuild -showsdks

      # 候选质量自动化评测：把「候选栏垃圾不垃圾」变成可断言数字。
      # 解密词库 → 编一个命令行工具（复用同一份 PinyinEngine 源码）→ 跑用例。
      # 首位命中率或前三命中率不达标就让这个 job 红，不靠人肉试打字。
      - name: 26 键拼音候选质量评测
        run: |
          set -o pipefail
          # macOS runner 的 python3 是 externally-managed，不能直接 pip install
          python3 -m venv /tmp/ev
          /tmp/ev/bin/python -m pip install --quiet cryptography
          mkdir -p /tmp/evaldict
          for n in pinyin assoc assoc_w seed; do
            /tmp/ev/bin/python tools/vault_enc.py dec2 "Support/dict/$n.bin.enc" "/tmp/evaldict/$n.bin"
          done
          xcrun swiftc -Onone -g -o /tmp/evalbin \
            tools/eval/main.swift tools/eval/stubs.swift \
            Sources/Keyboard/PinyinEngine.swift \
            Sources/Shared/SharedStore.swift Sources/Shared/SecVault.swift
          # 崩了要能看到调用栈：lldb 跑一遍，backtrace 直接进日志
          ANRAN_TRACE=1 ANRAN_DICT_DIR=/tmp/evaldict lldb -b \
            -o "run" -o "thread backtrace all" -o "quit" -- /tmp/evalbin 2>&1 | tee /tmp/eval.log
          # lldb 的退出码不可靠，用日志判断：必须出现 PASS
          grep -q "PASS" /tmp/eval.log

      - name: 编译（不签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project AnRanIME.xcodeproj \
            -scheme AnRanIME \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > /tmp/xcodebuild.log 2>&1 || {
              echo "==== 编译失败，尾部 150 行 ===="
              tail -150 /tmp/xcodebuild.log
              exit 1
            }
          echo "==== Rime 预编译阶段日志（关键行）===="
          grep -nE "Rime|rime|deploy|deployer|clang|\.bin|方案就位|解仓库|铺雾凇|opencc|No such|error:|Error|FAILED|失败" \
            /tmp/xcodebuild.log | tail -150 || true
          echo "==== 编译尾部 30 行 ===="
          tail -30 /tmp/xcodebuild.log

      - name: 核对 rime 打包结果
        run: |
          APPEX="build/Build/Products/Release-iphoneos/AnRanIME.app/PlugIns/AnRanKeyboard.appex"
          echo "== appex 里 rime 根目录 =="
          ls -la "$APPEX/rime" 2>/dev/null | head -50 || echo "（没有 rime 目录）"
          echo "== appex 里 rime/build（预编译 bin）=="
          ls -la "$APPEX/rime/build" 2>/dev/null || echo "（没有 build 目录 —— 运行时会退回自研引擎）"
          echo "== 主方案 =="
          ls -la "$APPEX/rime"/*.schema.yaml 2>/dev/null || echo "（没有 schema）"
          echo "== 词库目录 =="
          ls -la "$APPEX/rime/cn_dicts" 2>/dev/null | head -20 || echo "（没有 cn_dicts）"
          echo "== 八股文语言模型（octagram LM）=="
          ls -la "$APPEX/rime/zh-hans-t-essay-bgc.gram" 2>/dev/null || echo "（没有 gram —— 整句语言模型未生效）"
          ls -la "$APPEX/rime/rime_ice.custom.yaml" 2>/dev/null || echo "（没有 rime_ice.custom.yaml）"
          echo "== 预编译报告 =="
          cat "$APPEX/rime/_report.txt" 2>/dev/null || echo "（没有 _report.txt）"

      - name: 打成未签名 ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/AnRanIME.app"
          test -d "$APP"
          rm -rf Payload AnRanIME-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry AnRanIME-unsigned.ipa Payload
          ls -lh AnRanIME-unsigned.ipa
          echo "--- 扩展是否打进去了 ---"
          ls -l Payload/AnRanIME.app/PlugIns/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: AnRanIME-unsigned-ipa
          path: AnRanIME-unsigned.ipa
          retention-days: 30
